name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Check the committed icons
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 packaging/icon/make.py --check
          python3 packaging/icon/test.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          DIR="abstractions-$VERSION-$PLATFORM"
          mkdir "$DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="abstractions-$PLATFORM.zip"
            cp "target/$TARGET/release/abstractions.exe" "$DIR/"
            7z a "$ASSET" "$DIR"
          else
            ASSET="abstractions-$PLATFORM.tar.gz"
            cp "target/$TARGET/release/abstractions" "$DIR/"
            cp -R packaging/linux/share "$DIR/"
            tar -czf "$ASSET" "$DIR"
          fi
          NAMED="${ASSET/abstractions-/abstractions-$VERSION-}"
          cp "$ASSET" "$NAMED"
          rm -r "$DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PLAIN="abstractions-$VERSION-$PLATFORM.exe"
            cp "target/$TARGET/release/abstractions.exe" "$PLAIN"
          else
            PLAIN="abstractions-$VERSION-$PLATFORM"
            cp "target/$TARGET/release/abstractions" "$PLAIN"
          fi
          SUMS="SHA256SUMS-$PLATFORM-$VERSION.txt"
          sha256sum "$ASSET" "$NAMED" "$PLAIN" > "$SUMS"
          cat "$SUMS"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "NAMED=$NAMED" >> "$GITHUB_ENV"
          echo "PLAIN=$PLAIN" >> "$GITHUB_ENV"
          echo "SUMS=$SUMS" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.NAMED }}
            ${{ env.PLAIN }}
            ${{ env.SUMS }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.ASSET }}
            ${{ env.PLAIN }}
            ${{ env.SUMS }}

  macos-arch:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/abstractions
          retention-days: 1

  macos:
    needs: macos-arch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-bin-*
          path: target
      - run: |
          for arch in aarch64 x86_64; do
            mkdir -p "target/$arch-apple-darwin/release"
            mv "target/macos-bin-$arch-apple-darwin/abstractions" "target/$arch-apple-darwin/release/abstractions"
            chmod +x "target/$arch-apple-darwin/release/abstractions"
          done
      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=dev
          fi
          packaging/macos/bundle.sh "$VERSION" \
            target/aarch64-apple-darwin/release/abstractions \
            target/x86_64-apple-darwin/release/abstractions
          NAMED="Abstractions-v$VERSION-macos-universal.dmg"
          cp Abstractions-macos-universal.dmg "$NAMED"
          SUMS="SHA256SUMS-macos-universal-v$VERSION.txt"
          shasum -a 256 Abstractions-macos-universal.dmg "$NAMED" > "$SUMS"
          cat "$SUMS"
          echo "ASSET=Abstractions-macos-universal.dmg" >> "$GITHUB_ENV"
          echo "NAMED=$NAMED" >> "$GITHUB_ENV"
          echo "SUMS=$SUMS" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.NAMED }}
            ${{ env.SUMS }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: macos-universal
          path: |
            ${{ env.ASSET }}
            ${{ env.SUMS }}

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-musl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cargo-zigbuild
        run: pip install ziglang cargo-zigbuild
      - name: Build
        run: |
          for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p abstractions-server --target "$TARGET"
          done
      - name: Package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-musl/release/abstractions-server dist/amd64/
          cp target/aarch64-unknown-linux-musl/release/abstractions-server dist/arm64/
          file dist/amd64/abstractions-server dist/arm64/abstractions-server
          cp dist/amd64/abstractions-server abstractions-server-linux-x86_64
          cp dist/arm64/abstractions-server abstractions-server-linux-aarch64
          cp abstractions-server-linux-x86_64 "abstractions-server-$VERSION-linux-x86_64"
          cp abstractions-server-linux-aarch64 "abstractions-server-$VERSION-linux-aarch64"
          SUMS="SHA256SUMS-server-$VERSION.txt"
          sha256sum abstractions-server-linux-x86_64 abstractions-server-linux-aarch64 \
            "abstractions-server-$VERSION-linux-x86_64" "abstractions-server-$VERSION-linux-aarch64" > "$SUMS"
          cat "$SUMS"
          {
            echo "VERSION=$VERSION"
            echo "IMAGE_VERSION=${VERSION#v}"
            echo "SUMS=$SUMS"
          } >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            abstractions-server-linux-x86_64
            abstractions-server-linux-aarch64
            abstractions-server-${{ env.VERSION }}-linux-x86_64
            abstractions-server-${{ env.VERSION }}-linux-aarch64
            ${{ env.SUMS }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: server
          path: |
            abstractions-server-linux-x86_64
            abstractions-server-linux-aarch64
            ${{ env.SUMS }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/saravenpi/abstractions-server:latest
            ghcr.io/saravenpi/abstractions-server:${{ env.IMAGE_VERSION }}
