name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Check the committed icons
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 packaging/icon/make.py --check
          python3 packaging/icon/test.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          DIR="abstractions-$VERSION-$PLATFORM"
          mkdir "$DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="abstractions-$PLATFORM.zip"
            cp "target/$TARGET/release/abstractions.exe" "$DIR/"
            7z a "$ASSET" "$DIR"
          else
            ASSET="abstractions-$PLATFORM.tar.gz"
            cp "target/$TARGET/release/abstractions" "$DIR/"
            cp -R packaging/linux/share "$DIR/"
            tar -czf "$ASSET" "$DIR"
          fi
          NAMED="${ASSET/abstractions-/abstractions-$VERSION-}"
          cp "$ASSET" "$NAMED"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PLAIN="abstractions-$VERSION-$PLATFORM.exe"
            cp "target/$TARGET/release/abstractions.exe" "$PLAIN"
          else
            PLAIN="abstractions-$VERSION-$PLATFORM"
            cp "target/$TARGET/release/abstractions" "$PLAIN"
          fi
          SUMS="SHA256SUMS-$PLATFORM-$VERSION.txt"
          sha256sum "$ASSET" "$NAMED" "$PLAIN" > "$SUMS"
          cat "$SUMS"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "NAMED=$NAMED" >> "$GITHUB_ENV"
          echo "PLAIN=$PLAIN" >> "$GITHUB_ENV"
          echo "SUMS=$SUMS" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.NAMED }}
            ${{ env.PLAIN }}
            ${{ env.SUMS }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.ASSET }}
            ${{ env.PLAIN }}
            ${{ env.SUMS }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=dev
          fi
          packaging/macos/bundle.sh "$VERSION" \
            target/aarch64-apple-darwin/release/abstractions \
            target/x86_64-apple-darwin/release/abstractions
          NAMED="Abstractions-v$VERSION-macos-universal.dmg"
          cp Abstractions-macos-universal.dmg "$NAMED"
          SUMS="SHA256SUMS-macos-universal-v$VERSION.txt"
          shasum -a 256 Abstractions-macos-universal.dmg "$NAMED" > "$SUMS"
          cat "$SUMS"
          echo "ASSET=Abstractions-macos-universal.dmg" >> "$GITHUB_ENV"
          echo "NAMED=$NAMED" >> "$GITHUB_ENV"
          echo "SUMS=$SUMS" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.NAMED }}
            ${{ env.SUMS }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: macos-universal
          path: |
            ${{ env.ASSET }}
            ${{ env.SUMS }}
