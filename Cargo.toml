[package]
name = "abstractions"
authors = ["saravenpi"]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
description = "A pixelated low-poly island exploration game."
repository = "https://github.com/saravenpi/Abstractions"
license = "MIT"
publish = false

[features]
default = []
dev = ["bevy/dynamic_linking", "bevy/file_watcher", "bevy/debug"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "custom_cursor",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "picking",
    "audio",
    "serialize",
    "tonemapping_luts",
    "bevy_solari",
] }
avian3d = { version = "0.8.0", default-features = false, features = [
    "3d",
    "parry-f32",
    "parallel",
    "debug-plugin",
] }
bevy-persistent = { version = "0.12.0", features = ["toml"] }
dirs = "7.0.0"
noise = "0.9.0"
rand = "0.10.4"
rand_chacha = "0.10.0"
toml = "1.1"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"


