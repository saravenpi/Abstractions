[package]
name = "abstractions-net"
authors = ["saravenpi"]
version.workspace = true
edition = "2024"
rust-version = "1.97.1"
description = "The multiplayer protocol of Abstractions: shared types, packing, messages and the room."
repository = "https://github.com/saravenpi/Abstractions"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[features]
default = []
ecs = ["dep:bevy_ecs"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
glam = { version = "=0.33.12", features = ["serde"] }
bevy_ecs = { version = "0.20.1", default-features = false, optional = true }
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-smol"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
smol = "2"
socket2 = { version = "0.6.5", features = ["all"] }
sha2 = { version = "0.11.1", default-features = false }
toml = "1.1"
bytes = "1.12.1"
