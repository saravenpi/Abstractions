[tools]
rust = "1.98.1"

[tasks.run]
description = "Run the game in release mode"
run = "cargo run --release"

[tasks.dev]
description = "Run the game with fast dev builds"
run = "cargo run --features dev"

[tasks.test]
description = "Run the unit tests"
run = "cargo test --features dev"

[tasks.check]
description = "Format check, clippy, tests and filet"
run = [
  "cargo fmt --check",
  "cargo clippy --features dev --all-targets -- -D warnings",
  "cargo test --features dev",
  "filet check .",
]

[tasks.build-release]
description = "Build the optimized binary"
run = "cargo build --release"

[tasks.watch]
description = "Check the code on every save, with bacon"
run = "bacon"

[tasks.hot]
description = "Run the game with hot-patching: edited systems update in the running game"
run = "dx serve --hot-patch --features hot"
env = { CARGO_TARGET_DIR = "target/hot" }

[tasks.timings]
description = "Build and write target/cargo-timings/cargo-timing.html, to see what is slow"
run = "cargo build --features dev --timings"

[tasks.zoo]
description = "Show the home planet's animals walking, trotting and galloping: mise run zoo -- <seed> (needs examples/zoo.rs, untracked)"
run = "cargo run --features dev --example zoo --"

[tasks.check-fast]
description = "Clippy and the tests of one area: mise run check-fast -- gear::"
run = "cargo clippy --workspace --features dev --all-targets -- -D warnings && cargo test --features dev --lib --"
